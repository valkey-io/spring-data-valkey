name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 17
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/spring-data-valkey
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Start Valkey
        run: |
          make start PROJECT=valkey VERSION=8.1.1 GH_ORG=valkey-io

      - name: Test Spring Data Valkey
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            test -Pnone \
            -pl spring-data-valkey \
            -DrunLongTests=true \
            -Dvalkey.server.version=8.1.1 \
            -U -B

      - name: Package Spring Data Valkey
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            package javadoc:jar -DskipTests \
            -pl spring-data-valkey \
            -U -B

      - name: Install Spring Data Valkey
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            install -DskipTests \
            -pl spring-data-valkey -am \
            -Dgpg.skip=true \
            -B

      - name: Test Spring Boot Starter
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            test \
            -pl spring-boot-starter-data-valkey \
            -U -B

      - name: Package Spring Boot Starter
        run: |
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            package javadoc:jar -DskipTests \
            -pl spring-boot-starter-data-valkey \
            -U -B

      - name: Create draft release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          draft: true
          files: |
            spring-data-valkey/target/*.jar
            spring-boot-starter-data-valkey/target/*.jar
          generate_release_notes: true

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-publish
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: 17
          distribution: "temurin"

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/spring-data-valkey
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Configure GPG for non-interactive signing
        run: |
          mkdir -p ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          chmod 700 ~/.gnupg

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Fetch release credentials
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id spring-data-valkey-maven-token \
            --query SecretString --output text)
          OSSRH_USERNAME=$(echo "$SECRET" | jq -r '.["maven-central-username"]')
          OSSRH_PASSWORD=$(echo "$SECRET" | jq -r '.["maven-central-password"]')
          GPG_PASSPHRASE=$(echo "$SECRET" | jq -r '.["gpg-passphrase"]')
          GPG_KEYNAME=$(echo "$SECRET" | jq -r '.["gpg-key-id"]')
          if [ -z "$OSSRH_USERNAME" ] || [ "$OSSRH_USERNAME" = "null" ] || [ -z "$OSSRH_PASSWORD" ] || [ "$OSSRH_PASSWORD" = "null" ]; then
            echo "ERROR: Failed to extract Maven credentials from secret"
            exit 1
          fi
          if [ -z "$GPG_PASSPHRASE" ] || [ "$GPG_PASSPHRASE" = "null" ]; then
            echo "ERROR: Failed to extract GPG passphrase from secret"
            exit 1
          fi
          if [ -z "$GPG_KEYNAME" ] || [ "$GPG_KEYNAME" = "null" ]; then
            echo "ERROR: Failed to extract GPG key ID from secret"
            exit 1
          fi
          echo "::add-mask::$OSSRH_USERNAME"
          echo "::add-mask::$OSSRH_PASSWORD"
          echo "::add-mask::$GPG_PASSPHRASE"
          echo "OSSRH_USERNAME=$OSSRH_USERNAME" >> $GITHUB_ENV
          echo "OSSRH_PASSWORD=$OSSRH_PASSWORD" >> $GITHUB_ENV
          echo "GPG_PASSPHRASE=$GPG_PASSPHRASE" >> $GITHUB_ENV
          echo "GPG_KEYNAME=$GPG_KEYNAME" >> $GITHUB_ENV

      - name: Import GPG private key
        run: |
          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id spring-data-valkey-maven-token \
            --query SecretString --output text)
          GPG_KEY=$(echo "$SECRET" | jq -r '.["gpg-private-key"]')
          if [ -z "$GPG_KEY" ] || [ "$GPG_KEY" = "null" ]; then
            echo "ERROR: Failed to extract GPG private key from secret"
            exit 1
          fi
          echo "::add-mask::$GPG_KEY"
          echo "$GPG_KEY" | tr ' ' '\n' | base64 -d | gpg --batch --import
          if ! gpg --list-secret-keys --keyid-format short 2>/dev/null | grep -q 'sec'; then
            echo "ERROR: GPG key import failed"
            exit 1
          fi

      - name: Build and sign artifacts
        id: build
        run: |
          # Build + GPG-sign the publishable modules locally (no deploy to staging).
          ./mvnw -s settings.xml \
            -Ddevelocity.storage.directory=$HOME/.develocity-root \
            -Dmaven.repo.local=$HOME/.m2/spring-data-valkey \
            clean install javadoc:jar -DskipTests \
            -pl spring-data-valkey,spring-boot-starter-data-valkey -am \
            -U -B

      - name: Assemble Central bundle
        id: bundle
        run: |
          set -euo pipefail
          VERSION="$(./mvnw -s settings.xml help:evaluate -Dexpression=project.version -q -DforceStdout -N)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # module_dir|group_path|artifact_id
          MODULES=(
            "spring-data-valkey|io/valkey/springframework/data|spring-data-valkey"
            "spring-boot-starter-data-valkey|io/valkey/springframework/boot|spring-boot-starter-data-valkey"
          )

          rm -rf bundle bundle.zip
          for entry in "${MODULES[@]}"; do
            IFS='|' read -r DIR GROUP ARTIFACT <<< "$entry"
            OUT="bundle/${GROUP}/${ARTIFACT}/${VERSION}"
            mkdir -p "$OUT"

            # Published POM = the flattened pom.
            cp "${DIR}/.flattened-pom.xml" "${OUT}/${ARTIFACT}-${VERSION}.pom"

            for f in "${ARTIFACT}-${VERSION}.jar" "${ARTIFACT}-${VERSION}-sources.jar" "${ARTIFACT}-${VERSION}-javadoc.jar"; do
              cp "${DIR}/target/${f}" "${OUT}/"
              cp "${DIR}/target/${f}.asc" "${OUT}/"   # signatures from maven-gpg-plugin
            done

            # Sign the (flattened) POM, which target/*.asc does not cover.
            gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" \
              -u "${GPG_KEYNAME}" --armor --detach-sign "${OUT}/${ARTIFACT}-${VERSION}.pom"

            ( cd "$OUT"
              for file in *.jar *.pom; do
                md5sum "$file" | cut -d' ' -f1 > "${file}.md5"
                sha1sum "$file" | cut -d' ' -f1 > "${file}.sha1"
              done )
          done

          ( cd bundle && zip -qr ../bundle.zip . )
          echo "Bundle contents:"; unzip -l bundle.zip

      - name: Upload and release to Maven Central
        id: release
        run: |
          set -euo pipefail
          PORTAL="https://central.sonatype.com/api/v1/publisher"
          AUTH="Bearer $(printf '%s:%s' "$OSSRH_USERNAME" "$OSSRH_PASSWORD" | base64 | tr -d '\n')"

          # Upload the bundle; AUTOMATIC releases to Central after validation passes.
          # Upload returns 201 with the deployment id as the plain-text body.
          RESP="$(curl -s --fail-with-body -H "Authorization: $AUTH" \
            --form bundle=@bundle.zip "${PORTAL}/upload?publishingType=AUTOMATIC")"
          DEPLOYMENT_ID="$(echo "$RESP" | tail -n1)"
          echo "Deployment: $DEPLOYMENT_ID"
          # Guard against a malformed upload response (empty, whitespace, or an error
          # body) rather than assuming a specific id format. The status poll below is
          # the real validator of the id.
          if [ -z "${DEPLOYMENT_ID// }" ] || echo "$DEPLOYMENT_ID" | grep -q '[[:space:]<]'; then
            echo "ERROR: upload did not return a usable deployment id. Response was:"
            echo "$RESP"
            exit 1
          fi

          # Confirm it reaches PUBLISHED. Fail fast on FAILED; tolerate transient
          # unknown states but give up if they persist (likely a bad id or API outage).
          unknown=0
          for i in $(seq 1 40); do
            STATE="$(curl -s -X POST -H "Authorization: $AUTH" "${PORTAL}/status?id=${DEPLOYMENT_ID}" | jq -r '.deploymentState')"
            echo "  [$i] $STATE"
            case "$STATE" in
              PUBLISHED) echo "Released to Maven Central."; exit 0 ;;
              FAILED) echo "ERROR: deployment FAILED."; exit 1 ;;
              PENDING|VALIDATING|VALIDATED|PUBLISHING) unknown=0 ;;
              *) unknown=$((unknown+1));
                 [ "$unknown" -ge 3 ] && { echo "ERROR: repeated unexpected state '$STATE' (bad id or API error)."; exit 1; } ;;
            esac
            sleep 20
          done
          echo "ERROR: timed out (last: $STATE)."
          exit 1
